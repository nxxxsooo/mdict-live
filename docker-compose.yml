services:
  mdict-live:
    build: .
    image: tardivo/mdict-live:latest
    container_name: mdict-live
    restart: unless-stopped
    read_only: true
    ports:
      - "5248:5248"
    volumes:
      - ./library:/library:ro
      - ./data:/data
      - ./index:/data/index
      - ./config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    secrets:
      - mdict_live_token
    environment:
      MDICT_V2_ENABLED: "true"
      MDICT_LIBRARY_DIR: /library
      MDICT_DATA_DIR: /data
      MDICT_INDEX_DIR: /data/index
      MDICT_CONFIG_DIR: /config
      MDICT_LIVE_TOKEN_FILE: /run/secrets/mdict_live_token
      MDICT_CORS_ORIGINS: ${MDICT_CORS_ORIGINS:-}
      MDICT_TRUSTED_PROXY_HOPS: ${MDICT_TRUSTED_PROXY_HOPS:-0}
      MDICT_TRUSTED_PROXY_CIDRS: ${MDICT_TRUSTED_PROXY_CIDRS:-}
      REDIS_URL: ${REDIS_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5248/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["cache"]
    container_name: mdict-valkey
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=256m
    command: valkey-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""

secrets:
  mdict_live_token:
    file: ${MDICT_LIVE_TOKEN_FILE:-./secrets/mdict-live-token}
